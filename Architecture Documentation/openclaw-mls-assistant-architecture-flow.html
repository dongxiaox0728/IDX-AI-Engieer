<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw MLS Assistant Architecture Flow</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --ink: #172033;
      --muted: #647084;
      --line: #8a98ad;
      --comm: #e8f7f0;
      --comm-border: #2fb47c;
      --runtime: #edf3ff;
      --runtime-border: #4977d6;
      --skills: #fff4df;
      --skills-border: #e0a137;
      --data: #f1edff;
      --data-border: #7c63d9;
      --response: #fff0f2;
      --response-border: #cf5d70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 18%, rgba(73, 119, 214, 0.13), transparent 28%),
        radial-gradient(circle at 80% 12%, rgba(47, 180, 124, 0.12), transparent 28%),
        linear-gradient(135deg, #f8fafc 0%, var(--bg) 55%, #eef3f8 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1500px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .header {
      margin: 0 0 24px;
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .caption {
      max-width: 900px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .canvas {
      overflow-x: auto;
      border: 1px solid rgba(138, 152, 173, 0.22);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(17, 24, 39, 0.12);
      backdrop-filter: blur(12px);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1180px;
      height: auto;
    }

    .layer {
      fill: rgba(255, 255, 255, 0.68);
      stroke: rgba(138, 152, 173, 0.24);
      stroke-width: 1.4;
    }

    .layer-title {
      fill: #344056;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .card {
      filter: url(#cardShadow);
      stroke-width: 2.4;
    }

    .card-title {
      fill: #172033;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .card-desc {
      fill: #5d687a;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow);
    }

    .return-flow {
      fill: none;
      stroke: #cf5d70;
      stroke-width: 3;
      stroke-dasharray: 9 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#returnArrow);
    }
  </style>
</head>
<body>
  <main>
    <section class="header" aria-label="Diagram title">
      <h1>OpenClaw MLS Assistant Architecture Flow</h1>
      <p class="caption">User queries are routed from WhatsApp through OpenClaw skills and tools to retrieve MLS/property data, update memory, and return a response.</p>
    </section>

    <section class="canvas" aria-label="OpenClaw MLS Assistant architecture diagram">
      <svg viewBox="0 0 1560 780" role="img" aria-labelledby="svgTitle svgDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="svgTitle">OpenClaw MLS Assistant Architecture Flow</title>
        <desc id="svgDesc">Architecture workflow showing a user query moving from WhatsApp into OpenClaw runtime, skill selection, tool execution, MLS data retrieval, memory update, and response delivery.</desc>

        <defs>
          <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#111827" flood-opacity="0.14"/>
          </filter>

          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M2,2 L10,6 L2,10 Z" fill="#8a98ad"/>
          </marker>

          <marker id="returnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M2,2 L10,6 L2,10 Z" fill="#cf5d70"/>
          </marker>
        </defs>

        <rect x="0" y="0" width="1560" height="780" rx="24" fill="#ffffff" opacity="0.24"/>

        <rect class="layer" x="48" y="54" width="262" height="620" rx="22"/>
        <rect class="layer" x="336" y="54" width="306" height="620" rx="22"/>
        <rect class="layer" x="668" y="54" width="306" height="620" rx="22"/>
        <rect class="layer" x="1000" y="54" width="248" height="620" rx="22"/>
        <rect class="layer" x="1274" y="54" width="238" height="620" rx="22"/>

        <text class="layer-title" x="78" y="96">Communication Layer</text>
        <text class="layer-title" x="366" y="96">OpenClaw Runtime Layer</text>
        <text class="layer-title" x="698" y="96">Skills &amp; Tools Layer</text>
        <text class="layer-title" x="1030" y="96">Data Layer</text>
        <text class="layer-title" x="1304" y="96">Response/Memory Layer</text>

        <g id="user">
          <rect class="card" x="78" y="154" width="202" height="112" rx="18" fill="#e8f7f0" stroke="#2fb47c"/>
          <text class="card-title" x="104" y="198">User</text>
          <text class="card-desc" x="104" y="226">Starts the property</text>
          <text class="card-desc" x="104" y="247">query or follow-up</text>
        </g>

        <g id="whatsapp">
          <rect class="card" x="78" y="382" width="202" height="120" rx="18" fill="#e8f7f0" stroke="#2fb47c"/>
          <text class="card-title" x="104" y="426">WhatsApp Channel</text>
          <text class="card-desc" x="104" y="454">Receives messages</text>
          <text class="card-desc" x="104" y="475">and sends replies</text>
        </g>

        <g id="runtime">
          <rect class="card" x="384" y="154" width="212" height="112" rx="18" fill="#edf3ff" stroke="#4977d6"/>
          <text class="card-title" x="410" y="198">OpenClaw Runtime</text>
          <text class="card-desc" x="410" y="226">Hosts the assistant</text>
          <text class="card-desc" x="410" y="247">workflow execution</text>
        </g>

        <g id="orchestrator">
          <rect class="card" x="384" y="382" width="212" height="120" rx="18" fill="#edf3ff" stroke="#4977d6"/>
          <text class="card-title" x="410" y="426">Orchestrator</text>
          <text class="card-title" x="410" y="450">/ Skill Selector</text>
          <text class="card-desc" x="410" y="477">Routes requests to</text>
          <text class="card-desc" x="410" y="498">the correct skill</text>
        </g>

        <g id="skill">
          <rect class="card" x="716" y="154" width="212" height="112" rx="18" fill="#fff4df" stroke="#e0a137"/>
          <text class="card-title" x="742" y="198">Selected Skill</text>
          <text class="card-desc" x="742" y="226">Property search,</text>
          <text class="card-desc" x="742" y="247">stats, guidance</text>
        </g>

        <g id="tools">
          <rect class="card" x="716" y="382" width="212" height="120" rx="18" fill="#fff4df" stroke="#e0a137"/>
          <text class="card-title" x="742" y="426">Tool Execution</text>
          <text class="card-desc" x="742" y="454">Runs functions that</text>
          <text class="card-desc" x="742" y="475">query APIs and DBs</text>
        </g>

        <g id="source">
          <rect class="card" x="1030" y="282" width="188" height="138" rx="18" fill="#f1edff" stroke="#7c63d9"/>
          <text class="card-title" x="1054" y="326">MLS Database</text>
          <text class="card-title" x="1054" y="350">/ Property API</text>
          <text class="card-desc" x="1054" y="378">Returns listing</text>
          <text class="card-desc" x="1054" y="399">and market data</text>
        </g>

        <g id="memory">
          <rect class="card" x="1304" y="174" width="178" height="124" rx="18" fill="#fff0f2" stroke="#cf5d70"/>
          <text class="card-title" x="1326" y="218">Memory Update</text>
          <text class="card-desc" x="1326" y="246">Stores session</text>
          <text class="card-desc" x="1326" y="267">and long-term</text>
          <text class="card-desc" x="1326" y="288">context</text>
        </g>

        <g id="response">
          <rect class="card" x="1304" y="450" width="178" height="124" rx="18" fill="#fff0f2" stroke="#cf5d70"/>
          <text class="card-title" x="1326" y="494">Response</text>
          <text class="card-title" x="1326" y="518">back to User</text>
          <text class="card-desc" x="1326" y="545">Final answer via</text>
          <text class="card-desc" x="1326" y="566">WhatsApp</text>
        </g>

        <path class="flow" d="M179 266 L179 382"/>
        <path class="flow" d="M280 442 C318 442 330 210 384 210"/>
        <path class="flow" d="M490 266 L490 382"/>
        <path class="flow" d="M596 442 C632 442 652 210 716 210"/>
        <path class="flow" d="M822 266 L822 382"/>
        <path class="flow" d="M928 442 C972 442 978 351 1030 351"/>
        <path class="flow" d="M1218 351 C1264 351 1260 236 1304 236"/>
        <path class="flow" d="M1393 298 L1393 450"/>
        <path class="return-flow" d="M1304 512 C944 640 560 640 280 442"/>

        <text x="92" y="620" fill="#647084" font-size="15" font-weight="700">Inbound request path</text>
        <line x1="92" y1="640" x2="188" y2="640" stroke="#8a98ad" stroke-width="3" marker-end="url(#arrow)"/>
        <text x="244" y="620" fill="#647084" font-size="15" font-weight="700">Response return path</text>
        <line x1="244" y1="640" x2="340" y2="640" stroke="#cf5d70" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#returnArrow)"/>
      </svg>
    </section>
  </main>
</body>
</html>
